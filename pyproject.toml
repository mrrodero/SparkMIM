[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkmim"
version = "0.2.0"
description = "Framework PySpark distribuido de feature selection informacional (JMIM/CMIM)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "SparkMIM" }]
keywords = ["feature-selection", "mutual-information", "JMIM", "CMIM", "pyspark", "distributed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Matriz validada para Databricks 15.4 LTS (Spark 3.5.0) según la matriz
# corporativa sgt-apm3972-databricksdeps. En DBR el wheel se instala con
# --no-deps para no reemplazar los paquetes administrados por Databricks.
dependencies = [
    "pyspark==3.5.0",
    "numpy==1.23.5",
    "pandas==1.5.3",
    "scipy==1.11.1",
    "pyarrow==14.0.1",
]

[project.optional-dependencies]
xgb = ["xgboost4j-spark>=3.0"]
lgbm = ["lightgbm4j-spark>=3.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# El temporal de pytest vive dentro de .tmp_spark (gitignoreado): el JVM de
# Spark y pytest no ensucian la raíz del repo.
basetemp = ".tmp_spark/pytest"
